"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$fill\
$nodejs\
$bun\
$python\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bold #7aa2f7"
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "#f7768e"

[git_branch]
symbol = " "
style = "#bb9af7"
format = "[$symbol$branch(:$remote_branch)]($style) "
truncation_length = 30

[git_status]
style = "#e0af68"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
stashed = "󰏗 "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[git_state]
style = "#f7768e"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[fill]
symbol = " "

[nodejs]
symbol = " "
style = "#9ece6a"
format = "[$symbol$version]($style) "
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[bun]
symbol = "🍞 "
style = "#e0af68"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "#7dcfff"
format = '[$symbol$version( \($virtualenv\))]($style) '
detect_files = ["requirements.txt", "pyproject.toml", "setup.py", ".python-version", "Pipfile"]

[docker_context]
symbol = " "
style = "#7aa2f7"
format = "[$symbol$context]($style) "
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

[cmd_duration]
min_time = 2_000
style = "#414868"
format = "[ $duration]($style)"

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #bb9af7)"

[package]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
